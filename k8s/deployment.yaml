  apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-node-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-node-demo
  template:
    metadata:
      labels:
        app: student-node-demo
    spec:
      containers:
      - name: student-node-demo
        image: YOUR_DOCKERHUB_USERNAME/student-node-k8s:REPLACE_WITH_COMMIT_SHA
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
